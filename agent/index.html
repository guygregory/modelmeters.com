<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Model Meters - AI summary</title>
	<link rel="icon" type="image/png" href="../img/favicon.png">
	<link rel="stylesheet" href="../site.css">
	<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
	<base target="_self">
	<meta name="color-scheme" content="light dark">
	<meta name="theme-color" content="#087f6b">

</head>
<body class="summary-page ai-summary-page">
	<div class="container">
		<div class="card">
			<div class="card-hd">
				<div class="title"><a href="../index.html" class="brand">Model Meters</a></div>
				<nav class="workspace-nav" aria-label="Main navigation">
					<a href="../index.html">Microsoft Foundry</a>
					<a href="../github/index.html">GitHub Meters</a>
					<a href="./" aria-current="page"><span class="ui-icon icon-sparkles" aria-hidden="true"></span>AI Summaries</a>
				</nav>
				<div class="toolbar">
					<button id="btn-rss" title="RSS Feed"><span class="ui-icon icon-rss" aria-hidden="true"></span>RSS feed</button>
					<button id="btn-back" title="Back to Model Meters"><span class="ui-icon icon-back" aria-hidden="true"></span>Model Meters</button>
					<button id="btn-theme" class="icon-button" title="Toggle light/dark mode" aria-label="Toggle light/dark mode"><span class="ui-icon icon-moon" aria-hidden="true"></span></button>
				</div>
			</div>
			<div class="content">
				<section class="articles" id="articles">
					<div id="status" class="footer" style="border:none;">Loading monthly summaries…</div>
				</section>
			</div>
			<div class="footer">Powered by <a href="https://ai.azure.com/" target="_blank" rel="noopener noreferrer">Azure AI</a> + <a href="https://github.com/microsoftdocs/mcp" target="_blank" rel="noopener noreferrer">Microsoft Learn MCP Server</a></div>
		</div>
	</div>

	<script>
		// Theme support (preserves and allows switching)
		(() => {
			const root = document.documentElement;
			const btn = document.getElementById('btn-theme');

			// Check URL params first, then localStorage, then system preference
			const urlParams = new URLSearchParams(window.location.search);
			const paramTheme = urlParams.get('theme');
			const stored = localStorage.getItem('priceExplorerTheme');
			const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
			let mode = (paramTheme || stored || (prefersDark ? 'dark' : 'light')) === 'dark' ? 'dark' : 'light';

			if (paramTheme) localStorage.setItem('priceExplorerTheme', mode);

			function currentMode(){
				return root.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
			}

			function applyMode(newMode){
				const m = newMode === 'dark' ? 'dark' : 'light';
				if (m === 'dark') root.setAttribute('data-theme','dark');
				else root.removeAttribute('data-theme');
				localStorage.setItem('priceExplorerTheme', m);
				updateBtn();
			}

			function updateBtn(){
				const m = currentMode();
				// Show target mode on the button (same UX as main page)
				btn.innerHTML = `<span class="ui-icon icon-${m === 'dark' ? 'sun' : 'moon'}" aria-hidden="true"></span>`;
				btn.setAttribute('aria-label', 'Switch to ' + (m === 'dark' ? 'light' : 'dark') + ' theme');
				btn.title = btn.getAttribute('aria-label');
				btn.setAttribute('aria-pressed', m === 'dark');
			}

			applyMode(mode);
			btn.addEventListener('click', () => {
				const isDark = currentMode() === 'dark';
				applyMode(isDark ? 'light' : 'dark');
			});
		})();

		// Back button
		document.getElementById('btn-back').addEventListener('click', () => {
			window.location.href = '../index.html';
		});

		// RSS button
		document.getElementById('btn-rss').addEventListener('click', () => {
			window.location.href = './rss.xml';
		});

		function getEnsuredBase() {
			const { origin, pathname } = window.location;
			const pathBase = pathname.endsWith('/') ? pathname : pathname + '/';
			return origin + pathBase; // always ends with '/'
		}

		async function listMarkdownFiles(dirUrl) {
			// Strategy:
			// 1) Try directory listing (works locally with Python http.server)
			// 2) Try JSON manifest at aisummary/index.json (array of filenames or {files:[]})
			// 3) Fallback: parse monthly/index.html to get article ids -> map to YYYY-MM-DD.md
			// Return newest-first.

			// Important: when the page is loaded as /agent (no trailing slash),
			// relative fetches like 'aisummary/' would incorrectly resolve to /aisummary/.
			// Build absolute URLs against a base that guarantees a trailing slash.
			const ensuredBase = getEnsuredBase();
			const dirAbs = new URL(dirUrl, ensuredBase).toString();
			// 1) Directory listing
			try {
				const res = await fetch(dirAbs);
				if (res.ok) {
					const html = await res.text();
					const doc = new DOMParser().parseFromString(html, 'text/html');
					const hrefs = Array.from(doc.querySelectorAll('a'))
						.map(a => a.getAttribute('href'))
						.filter(h => h && h.toLowerCase().endsWith('.md'));
					const files = Array.from(new Set(hrefs.map(h => h.split('#')[0].split('?')[0])));
					if (files.length) {
						files.sort((a, b) => b.localeCompare(a));
						return files;
					}
				}
			} catch (_) { /* ignore and try next */ }

			// 2) Manifest
			try {
				const manifestUrl = new URL('index.json', dirAbs);
				const res = await fetch(manifestUrl);
				if (res.ok) {
					const data = await res.json();
					const files = Array.isArray(data) ? data : (data.files || []);
					if (files.length) {
						files.sort((a, b) => b.localeCompare(a));
						return files;
					}
				}
			} catch (_) { /* ignore */ }

			return [];
		}

		function filenameBase(path) {
			const name = path.split('/').pop();
			return name.endsWith('.md') ? name.slice(0, -3) : name;
		}

		function createArticle({ id, title, html, collapsed }) {
			const article = document.createElement('article');
			article.className = 'article' + (collapsed ? ' collapsed' : '');
			article.id = id;

			const header = document.createElement('div');
			header.className = 'month-title';
			header.setAttribute('role', 'button');
			header.setAttribute('tabindex', '0');
			header.setAttribute('aria-expanded', String(!collapsed));
			header.innerHTML = `<span class="chev ui-icon icon-next" aria-hidden="true"></span><h2 class="month-heading">${title}</h2>`;
			header.addEventListener('click', () => {
				article.classList.toggle('collapsed');
				header.setAttribute('aria-expanded', String(!article.classList.contains('collapsed')));
				history.replaceState(null, '', '#' + id); // keep URL in sync
			});
			header.addEventListener('keydown', event => {
				if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); header.click(); }
			});

			const details = document.createElement('div');
			details.className = 'month-details';
			const mdContainer = document.createElement('div');
			mdContainer.className = 'markdown-body';
			mdContainer.innerHTML = html;
			details.appendChild(mdContainer);

			article.appendChild(header);
			article.appendChild(details);
			return article;
		}

		async function loadSummaries() {
			const status = document.getElementById('status');
			const container = document.getElementById('articles');
			try {
				const dir = '../monthly/aisummary/';
				const files = await listMarkdownFiles(dir);
				if (!files.length) {
					status.textContent = 'No Markdown files found in monthly/aisummary/';
					return;
				}

				// Fetch all markdown files in parallel, skipping any missing ones
				const results = await Promise.allSettled(files.map(async (file) => {
					const ensuredBase = getEnsuredBase();
					const dirAbs = new URL(dir, ensuredBase);
					const url = new URL(file, dirAbs);
					const res = await fetch(url);
					if (!res.ok) throw new Error('Failed to fetch ' + url);
					const text = await res.text();
					// Extract the first H1 for the clickable title
					let title = filenameBase(file);
					const h1Match = text.match(/^#\s*(.+)$/m);
					if (h1Match) title = h1Match[1];

					// Remove the first H1 (and a following blank line, if present) from content to avoid duplicates
					const lines = text.split(/\r?\n/);
					const idx = lines.findIndex(l => /^#\s/.test(l));
					if (idx !== -1) {
						lines.splice(idx, 1);
						if (lines[idx] === '') lines.splice(idx, 1);
					}
					const stripped = lines.join('\n');
					const html = marked.parse(stripped);
					return { file, title, html };
				}));

				const fetched = results.filter(r => r.status === 'fulfilled').map(r => r.value);

				// Clear status and append articles
				if (!fetched.length) {
					status.textContent = 'No Markdown files could be loaded. On Azure Static Web Apps, add monthly/aisummary/index.json (list of files).';
					return;
				}
				status.remove();
				fetched.forEach((item, idx) => {
					const id = filenameBase(item.file);
					const article = createArticle({ id, title: item.title, html: item.html, collapsed: idx !== 0 });
					container.appendChild(article);
				});

				// If there's a hash, expand and scroll
				if (location.hash) {
					const el = document.getElementById(location.hash.slice(1));
					if (el) {
						el.classList.remove('collapsed');
						el.querySelector('.month-title').setAttribute('aria-expanded', 'true');
					}
				}
			} catch (err) {
				console.error(err);
				status.textContent = 'Error loading summaries. Ensure directory listing is enabled for monthly/aisummary/.';
			}
		}

		// Kick off
			loadSummaries();
	</script>
</body>
</html>
